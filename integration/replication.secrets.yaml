services:
  primary:
    environment:
      POSTGRES_PASSWORD: "${REPL_POSTGRES_PASSWORD:?REPL_POSTGRES_PASSWORD not set in .env}"
  replica:
    environment:
      POSTGRES_PASSWORD: "${REPL_POSTGRES_PASSWORD:?REPL_POSTGRES_PASSWORD not set in .env}"
      REPLICATOR_PASSWORD: "${REPLICATOR_PASSWORD:?REPLICATOR_PASSWORD not set in .env}"
    volumes:
      - ../integration/replica_entrypoint.sh:/replica.sh:ro
