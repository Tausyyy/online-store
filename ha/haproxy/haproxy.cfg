global
    maxconn 200

defaults
    mode tcp
    timeout connect 4s
    timeout client  30m
    timeout server  30m

# Чтобы HAProxy находил контейнеры по имени, даже если они перезапускались
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

# Страница статуса: http://127.0.0.1:7000
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s
    timeout client 30s
    timeout server 30s

# ЗАПИСЬ (порт 5000): HAProxy каждые 2 секунды спрашивает у Patroni "ты primary?"
# (адрес /primary). Ответ 200 - пускаем клиентов на этот узел, иначе нет.
listen postgres_write
    bind *:5000
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008

# ЧТЕНИЕ (порт 5001): то же самое, но спрашиваем "ты replica?" (адрес /replica)
listen postgres_read
    bind *:5001
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
